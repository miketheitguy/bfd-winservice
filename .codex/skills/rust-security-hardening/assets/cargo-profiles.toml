[profile.dev]
debug = 2
overflow-checks = true

[profile.release]
opt-level = 3
debug = 0
strip = "symbols"
overflow-checks = true
panic = "abort"

[profile.asan]
inherits = "dev"
panic = "unwind"

[lints.rust]
warnings = { level = "deny", priority = -1 }
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"
