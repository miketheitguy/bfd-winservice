name: Build Windows bundle

on:
  pull_request:
    branches: ['main']
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: msi-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  asan:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve release version
        if: github.ref_type == 'tag'
        env:
          BFD_RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/Set-ReleaseVersion.ps1 -Tag $env:BFD_RELEASE_TAG
      - name: Load the repository Rust toolchain
        run: rustup show
      - name: Run Rust and native AddressSanitizer tests
        run: ./scripts/Test-Asan.ps1
      - name: Upload sanitizer diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ASan-diagnostics-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            target/asan/*.log
            target/asan/*.jsonl

  fuzz:
    runs-on: windows-2025
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve release version
        if: github.ref_type == 'tag'
        env:
          BFD_RELEASE_TAG: ${{ github.ref_name }}
        run: ./scripts/Set-ReleaseVersion.ps1 -Tag $env:BFD_RELEASE_TAG
      - name: Load the repository Rust toolchain
        run: rustup show
      - name: Install fuzz driver and dependency auditor
        run: |
          $repository = (Get-Location).Path
          Push-Location $env:RUNNER_TEMP
          try {
            cargo +stable install cargo-fuzz --version 0.13.2 --locked `
              --root (Join-Path $repository 'target/fuzz-tools') `
              --target-dir (Join-Path $repository 'target/fuzz-tools-build')
            if ($LASTEXITCODE -ne 0) { throw 'Could not install the pinned fuzz driver.' }
            cargo +stable install cargo-audit --locked
            if ($LASTEXITCODE -ne 0) { throw 'Could not install cargo-audit.' }
          } finally {
            Pop-Location
          }
      - name: Audit fuzz dependencies for security advisories
        run: |
          cargo audit --file fuzz/Cargo.lock
          if ($LASTEXITCODE -ne 0) { throw 'Fuzz dependency audit failed.' }
      - name: Check fuzz formatting
        run: cargo fmt --manifest-path fuzz/Cargo.toml -- --check
      - name: Check fuzz harness lints
        run: cargo clippy --locked --manifest-path fuzz/Cargo.toml --no-default-features --all-targets --target-dir target/fuzz-tests -- -D warnings
      - name: Run fuzz harness regression tests
        run: |
          ./scripts/Initialize-Asan.ps1
          cargo test --locked --manifest-path fuzz/Cargo.toml --no-default-features --lib --target-dir target/fuzz-tests
          if ($LASTEXITCODE -ne 0) { throw 'Fuzz harness regression tests failed.' }
      - name: Run bounded AddressSanitizer fuzz campaigns
        run: ./scripts/Test-Fuzz.ps1 -Seconds 15 -Runs 10000
      - name: Upload fuzz diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Fuzz-diagnostics-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            target/fuzz/*.log
            target/fuzz/artifacts/**

  build-msi:
    runs-on: windows-2025
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      DOTNET_ROLL_FORWARD: Major
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Resolve build version
        id: version
        env:
          BFD_REF_TYPE: ${{ github.ref_type }}
          BFD_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:BFD_REF_TYPE -eq 'tag') {
            $version = ./scripts/Set-ReleaseVersion.ps1 -Tag $env:BFD_RELEASE_TAG
          } else {
            $metadata = cargo metadata --locked --no-deps --format-version 1
            if ($LASTEXITCODE -ne 0) { throw 'Could not read the validation build version.' }
            $packages = @(($metadata | ConvertFrom-Json).packages | Where-Object name -EQ 'bfd-winservice')
            if ($packages.Count -ne 1) { throw 'Expected one BFD package.' }
            $version = $packages[0].version
          }
          "version=$version" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
          Write-Output "Build version $version from $env:BFD_REF_TYPE $env:BFD_RELEASE_TAG"
      - name: Install .NET SDK for WiX
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - name: Load the repository Rust toolchain
        run: rustup show
      - name: Audit dependencies for security advisories
        run: |
          # Build the auditor outside the repository so its build-std hardening
          # configuration doesn't apply; the audit itself reads Cargo.lock.
          Push-Location $env:RUNNER_TEMP
          try { cargo +stable install cargo-audit --locked }
          finally { Pop-Location }
          if ($LASTEXITCODE -ne 0) { throw 'Could not install cargo-audit.' }
          cargo audit
          if ($LASTEXITCODE -ne 0) { throw 'cargo audit reported a dependency advisory.' }
      - name: Check release version stamping
        run: ./scripts/Test-ReleaseVersion.ps1
      - name: Check installer ACL validation
        run: ./scripts/Test-RestrictedAcl.ps1
      - name: Check installer hardening
        run: ./scripts/Test-InstallerHardening.ps1
      - name: Check DPAPI key provisioning
        run: ./scripts/Test-BfdAuthenticationKey.ps1
      - name: Check rollback privilege fixtures
        run: ./scripts/Test-RollbackPrivileges.ps1
      - name: Check service recovery isolation fixtures
        run: ./scripts/Test-ServiceTestRecovery.ps1
      - name: Check native compiler and runtime compatibility policy
        run: ./scripts/Test-NativeRuntimePolicy.ps1
      - name: Check Rust formatting
        run: cargo fmt --check
      - name: Check documentation links
        run: |
          ./scripts/Test-DocumentationLinkPolicy.ps1
          ./scripts/Test-DocumentationLinks.ps1
      - name: Check public API documentation
        env:
          RUSTDOCFLAGS: '-D warnings -D missing-docs'
        run: cargo doc --locked --no-deps
      - name: Check Rust lints in release mode
        env:
          # Match the optimized test harness when checking all targets.
          CARGO_PROFILE_RELEASE_PANIC: unwind
        run: cargo clippy --locked --release --all-targets -- -D warnings
      - name: Run optimized tests
        run: |
          cargo test-release
          if ($LASTEXITCODE -ne 0) { throw 'Optimized tests failed.' }
          $hardeningTests = @(
            cargo test-release --no-run --test windows_hardening --message-format=json |
              ForEach-Object { $_ | ConvertFrom-Json } |
              Where-Object {
                $_.reason -eq 'compiler-artifact' -and
                $_.target.name -eq 'windows_hardening' -and $_.executable
              } |
              Select-Object -ExpandProperty executable
          )
          if ($LASTEXITCODE -ne 0 -or $hardeningTests.Count -ne 1) {
            throw 'Expected one compiled release hardening test executable.'
          }
          "BFD_HARDENING_TEST_EXE=$($hardeningTests[0])" |
            Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8
      - name: Check native RPC and MI coexistence
        run: |
          cargo test-release --lib local_rpc::tests::native_provider_traffic_preserves_fixed_rpc_policy_and_replacement_rejection -- --ignored --exact
          if ($LASTEXITCODE -ne 0) { throw 'In-process RPC/MI identity isolation failed.' }
          cargo test-release --lib bgp::ipc::tests::native_bgp_rpc_and_provider_security_coexist -- --ignored --exact
          if ($LASTEXITCODE -ne 0) { throw 'BGP RPC/MI security coexistence failed.' }
      - name: Build hardened executables and offline setup bundle
        run: ./scripts/Build-Bundle.ps1 -AcceptWixEula
      - name: Verify production executable hardening
        run: |
          $env:BFD_HARDENING_EXE = (Resolve-Path 'target/x86_64-pc-windows-msvc/release/bfd-winservice.exe').Path
          & $env:BFD_HARDENING_TEST_EXE
          if ($LASTEXITCODE -ne 0) { throw 'Release executable hardening validation failed.' }
      - name: Test embedded MSI rollback, installation, and removal
        env:
          BFD_RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $msi = "target/bundle-build/$env:BFD_RELEASE_VERSION/BfdWinService-$env:BFD_RELEASE_VERSION-x64.msi"
          if (-not (Test-Path -LiteralPath $msi)) { throw 'Expected the private bundle MSI payload.' }
          ./scripts/Test-MsiRollback.ps1 -Path $msi
          ./scripts/Test-MsiInstall.ps1 -Path $msi -ExpectedVersion $env:BFD_RELEASE_VERSION
      - name: Test setup prerequisite, repair, and removal
        env:
          BFD_RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $setup = @(Get-ChildItem -LiteralPath target/installer -Filter '*-setup.exe')
          if ($setup.Count -ne 1) { throw 'Expected one setup bundle.' }
          ./scripts/Test-BundleInstall.ps1 -Path $setup[0].FullName -ExpectedVersion $env:BFD_RELEASE_VERSION
      - name: Test published-version upgrade and failed-upgrade rollback
        env:
          BFD_RELEASE_VERSION: ${{ steps.version.outputs.version }}
          BFD_UPGRADE_BASELINE: '2.0.0'
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $baselineDirectory = 'target/upgrade-baseline'
          New-Item -ItemType Directory -Path $baselineDirectory -Force | Out-Null
          $baselineName = "BfdWinService-$env:BFD_UPGRADE_BASELINE-x64-setup.exe"
          gh release download "v$env:BFD_UPGRADE_BASELINE" --pattern $baselineName `
            --pattern "$baselineName.sha256" --dir $baselineDirectory
          if ($LASTEXITCODE -ne 0) { throw 'Could not download the published upgrade baseline.' }
          $previous = Join-Path $baselineDirectory $baselineName
          $checksum = (Get-Content -LiteralPath "$previous.sha256" -Raw).Trim()
          $hash = (Get-FileHash -LiteralPath $previous -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($checksum -cne "$hash  $baselineName") { throw 'Published baseline checksum mismatch.' }
          $setup = "target/installer/BfdWinService-$env:BFD_RELEASE_VERSION-x64-setup.exe"
          $msi = "target/bundle-build/$env:BFD_RELEASE_VERSION/BfdWinService-$env:BFD_RELEASE_VERSION-x64.msi"
          ./scripts/Test-MsiUpgrade.ps1 -Path $setup -MsiPath $msi `
            -ExpectedVersion $env:BFD_RELEASE_VERSION -PreviousPath $previous `
            -PreviousVersion $env:BFD_UPGRADE_BASELINE
      - name: Upload setup bundle and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: BfdWinService-x64-${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
          path: |
            target/installer/*-setup.exe
            target/installer/*-setup.exe.sha256
      - name: Upload installer test logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Installer-test-logs-${{ github.sha }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            target/installer/*.log
            target/installer/bundle-install-validation.json
            target/installer/upgrade-validation.json
            target/installer/upgrade-policy-mismatch.json
            target/bundle-build/**/*.log
            target/bundle-build/**/service-test-diagnostics.json

  publish-release:
    needs: [asan, fuzz, build-msi]
    if: github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-2025
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download validated setup bundle and checksum
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: BfdWinService-x64-${{ github.sha }}
          path: release-assets
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_VERSION: ${{ needs.build-msi.outputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw 'Release tags must use vMAJOR.MINOR.PATCH.'
          }
          $version = $env:RELEASE_VERSION
          if ($tag -cne "v$version") { throw 'Release tag does not match the validated package version.' }
          $setup = "release-assets/BfdWinService-$version-x64-setup.exe"
          $assets = @(
            $setup,
            "$setup.sha256"
          )
          foreach ($asset in $assets) {
            if (-not (Test-Path -LiteralPath $asset -PathType Leaf)) {
              throw "Release asset not found: $asset"
            }
          }
          foreach ($installer in @($setup)) {
            $checksum = (Get-Content -LiteralPath "$installer.sha256" -Raw).Trim()
            $expectedChecksum = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($checksum -cne "$expectedChecksum  $(Split-Path $installer -Leaf)") {
              throw "Release installer checksum mismatch: $installer"
            }
          }
          $releaseJson = & gh release view $tag --json isDraft,assets 2>$null
          if ($LASTEXITCODE -ne 0) {
            $notes = "docs/releases/$version.md"
            if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) { throw 'Release compatibility notes are missing.' }
            & gh release create $tag @assets --verify-tag `
              --title "BFD Windows Service $tag" --notes-file $notes
            if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed.' }
          } else {
            $release = $releaseJson | ConvertFrom-Json
            if ($release.isDraft) {
              & gh release upload $tag @assets --clobber
              if ($LASTEXITCODE -ne 0) { throw 'Draft release asset upload failed.' }
              & gh release edit $tag --draft=false
              if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }
            } else {
              $publishedNames = @($release.assets | ForEach-Object name)
              $missingAssets = @($assets | Where-Object {
                (Split-Path $_ -Leaf) -notin $publishedNames
              })
              if ($missingAssets.Count -gt 0) {
                & gh release upload $tag @missingAssets
                if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed.' }
              } else {
                Write-Output "Release $tag already contains all assets."
              }
            }
          }
