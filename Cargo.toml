[package]
name = "bfd-winservice"
version = "0.1.0"
edition = "2021"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
md5 = "0.8"
rand = "0.8"
sha1 = "0.10"
subtle = "2.6"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
ctrlc = "3.5"
socket2 = { version = "0.6", features = ["all"] }
windows-service = "0.8.1"
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_System_Diagnostics_Etw", "Win32_System_IO", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Wmi"] }

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"

[profile.dev]
debug = 2
overflow-checks = true

[profile.release]
debug = 2
strip = "none"
overflow-checks = true
panic = "abort"

[profile.asan]
inherits = "dev"
panic = "unwind"

[lints.rust]
warnings = { level = "deny", priority = -1 }
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"
