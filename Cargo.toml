[package]
name = "bfd-winservice"
version = "3.0.2"
edition = "2021"
default-run = "bfd-winservice"

[dependencies]
arc-swap = "1.9"
clap = { version = "4.5", features = ["derive"] }
md-5 = "0.10"
rand = "0.8"
sha1 = "0.10"
subtle = "2.6"
thiserror = "2"

[target.'cfg(windows)'.dependencies]
ctrlc = "3.5"
socket2 = { version = "0.6", features = ["all"] }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Com"] }
windows-service = "0.8.1"
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Diagnostics_Etw", "Win32_System_IO", "Win32_System_Registry", "Win32_System_Rpc", "Win32_System_Services", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Wmi"] }

[dev-dependencies]
assert_cmd = "2"
tempfile = "3"

[profile.dev]
debug = 2
overflow-checks = true

[profile.release]
opt-level = 3
debug = 0
strip = "symbols"
overflow-checks = true
panic = "abort"

[profile.asan]
inherits = "dev"
panic = "unwind"

[lints.rust]
warnings = { level = "deny", priority = -1 }
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"
